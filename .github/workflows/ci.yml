name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Offline: fixtures only, no Azure resources. Integration tests skip
      # themselves here because STORAGE_CONNECTION_STRING is unset.
      - name: Unit tests
        run: npm test

      # The Windows setup app's step logic is plain Node, so it needs no Electron install.
      - name: Setup app tests
        run: node scripts/runTests.js --dir desktop/test

      # Exercises the storage layer against a real Azure Storage API, which
      # the in-memory fakes in the unit tests cannot cover.
      - name: Start Azurite
        run: |
          npx azurite-blob --location /tmp/azurite --blobPort 10000 --skipApiVersionCheck &
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 10000; then echo "Azurite ready"; exit 0; fi
            sleep 1
          done
          echo "Azurite failed to start within 30s" >&2
          exit 1

      - name: Integration tests
        run: npm run test:integration

  desktop:
    name: Windows setup app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the setup app's dependencies
        working-directory: desktop
        run: npm ci

      - name: Setup app tests
        run: node scripts/runTests.js --dir desktop/test

      - name: Build the Windows installer
        working-directory: desktop
        run: npm run dist

      # Starts the packaged app hidden, checks its page loaded every step, and exits.
      - name: Smoke-test the packaged app
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/SurveyMonkey Power BI Connector.exe" -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

  infra:
    name: Infrastructure template
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # azuredeploy.json is what the Deploy to Azure button deploys, so it
      # must be the current compilation of main.bicep. The failure mode this
      # guards against is editing the Bicep, forgetting to recompile, and
      # shipping a button that installs the previous infrastructure.
      - name: Recompile Bicep and check the committed template is current
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/azuredeploy.json

          # The generator version is written into metadata and moves with the
          # toolchain, so it is stripped before comparing.
          strip() { jq -S 'del(.metadata._generator)' "$1"; }

          if ! diff -u <(strip azuredeploy.json) <(strip /tmp/azuredeploy.json); then
            echo "::error::azuredeploy.json is out of date. Run: az bicep build --file infra/main.bicep --outfile azuredeploy.json"
            exit 1
          fi
