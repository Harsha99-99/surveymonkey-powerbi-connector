name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the deployment package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The published zip is what the Deploy to Azure button installs via
      # WEBSITE_RUN_FROM_PACKAGE, so it ships production dependencies only —
      # no dev dependencies, no tests, no docs.
      - name: Build the package
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          zip -r surveymonkey-powerbi-connector.zip \
            host.json package.json package-lock.json \
            src public node_modules \
            -x '*.test.js'

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: surveymonkey-powerbi-connector.zip
          generate_release_notes: true

  desktop:
    name: Build and publish the Windows setup app
    runs-on: windows-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the setup app's dependencies
        working-directory: desktop
        run: npm ci

      - name: Setup app tests
        run: node scripts/runTests.js --dir desktop/test

      - name: Build the Windows installer
        working-directory: desktop
        run: npm run dist

      # Starts the packaged app hidden, checks its page loaded every step, and exits.
      - name: Smoke-test the packaged app
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/SurveyMonkey Power BI Connector.exe" -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      # A fixed file name, so the README can link to
      # releases/latest/download/SurveyMonkey-PowerBI-Setup.exe.
      - name: Attach the installer to the release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/SurveyMonkey-PowerBI-Setup.exe
